<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form with map</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="header">
        <a href="main/main.html">
            <img src="logo.png" alt="Logo" class="logo">
        </a>
    </div>
    <div class="ffbox">
        <div class="ffbox1">
            <h1 class="gfg">Contact Us</h1>
            <h2>Fill The Following Details</h2>
            <form>
                <label for="fullName">
                    <i class="fa fa-solid fa-user" style="margin: 2px;"></i> Full Name:
                </label>
                <input type="text" id="fullName" name="fullName" required>

                <label for="email">
                    <i class="fa fa-solid fa-envelope" style="margin: 2px;"></i> Email Address:
                </label>
                <input type="email" id="email" name="email" required>

                <label for="mobile">
                    <i class="fa fa-solid fa-phone" style="margin: 2px;"></i> Contact No:
                </label>
                <input type="tel" id="mobile" name="mobile" required>

                <label for="msg">
                    <i class="fa fa-solid fa-comment" style="margin: 2px;"></i> Write Message:
                </label>
                <textarea id="msg" name="msg" rows="5" required></textarea>

                <button type="submit">Submit</button>
            </form>
        </div>

        <!-- Updated iframe with the correct location of MVN School, Sector 17, Faridabad -->
        <div class="map-div">
            <!-- Updated iframe URL with a marker at MVN School, Sector 17 -->
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7004.457704442871!2d77.30727912814038!3d28.38730557996039!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cdc43d495d1f7%3A0xdfb2b27b63173bb5!2sMVN%20School%20Sector%2017!5e0!3m2!1sen!2sin!4v1699366814583!5m2!1sen!2sin&markers=color:red%7Clabel:%7C28.38730557996039,77.30727912814038"
                width="100%" height="95%" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </div>
</body>

</html>
