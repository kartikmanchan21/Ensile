<!DOCTYPE html>

  <title>My Research Portfolio</title>
  <style>
    /* Reset & Global Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Header Styling */
    header {
      background-color: #002a5c;
      width: 100%;
      padding: 20px;
      text-align: center;
      color: #ffffff;
    }

    header h1 {
      font-size: 2.5rem;
    }

    /* Research Section */
    .research-list {
      width: 100%;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .research-list h2 {
      font-size: 2rem;
      color: #002a5c;
      margin-bottom: 20px;
      text-align: center;
    }

    .research-item {
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .research-item:last-child {
      border-bottom: none;
    }

    .research-item a {
      text-decoration: none;
      color: #002a5c;
      font-size: 1.2rem;
    }

    .research-item a:hover {
      color: #0056b3;
      text-decoration: underline;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #666;
      text-align: center;
    }
  </style>
</head>
